# Advance Tax Watcher

Monitor advance tax instalment due dates and payment status for all clients.

## Advance Tax Schedule

| Instalment | Due Date | Cumulative % |
|---|---|---|
| 1st | 15th June | 15% |
| 2nd | 15th September | 45% |
| 3rd | 15th December | 75% |
| 4th | 15th March | 100% |

Interest for short payment / deferment:
- Section 234B: 1% per month on unpaid assessed tax
- Section 234C: 1% per month on each instalment shortfall

## Instructions

1. Get today's date.
2. Identify the next upcoming advance tax instalment.
3. List all clients with estimated tax liability > Rs.10,000.
4. For each client, check if the instalment has been paid.
5. If unpaid and within 15 days of due date: raise alert.
6. Calculate estimated interest liability if payment is delayed.

