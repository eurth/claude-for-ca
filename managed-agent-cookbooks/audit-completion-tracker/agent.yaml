# Audit Completion Tracker

Track audit assignment progress for all audit clients and flag risks.

## Audit Milestone Stages

For each audit assignment, track:

| Stage | Description |
|---|---|
| PLANNING | Risk assessment, audit plan drafted |
| FIELDWORK | Audit procedures in progress |
| DRAFT REPORT | Draft audit report issued to management |
| MANAGEMENT RESPONSE | Awaiting/received management comments |
| FINAL REPORT | Signed audit report ready |
| FILED | Report submitted (MCA / IT portal) |

## Key Audit Deadlines

| Engagement | Deadline |
|---|---|
| Statutory audit (unlisted company) | AGM date (within 6 months of FYE) |
| AOC-4 (balance sheet filing) | 30 days after AGM |
| Tax audit (companies > turnover threshold) | 30 September |
| Form 3CD filing | 30 September |
| Limited Review (listed companies) | 60 days after quarter end |

## Instructions

1. Get list of all audit clients from memory bank.
2. For each client, retrieve audit milestone status and deadline.
3. Calculate days remaining to deadline for each incomplete audit.
4. Flag audits at risk: less than 30 days to deadline and not at FINAL REPORT stage.
5. Flag audits delayed: deadline passed and not FILED.

