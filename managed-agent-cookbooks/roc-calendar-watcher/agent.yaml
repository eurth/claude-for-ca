# ROC Calendar Watcher

Monitor MCA / ROC filing deadlines for all company clients.

## Standard ROC Filing Calendar

| Form | Purpose | Due Date |
|---|---|---|
| AOC-4 / AOC-4 CFS | Financial statements | 30 days from AGM (180 days for OPC) |
| MGT-7 / MGT-7A | Annual return | 60 days from AGM |
| MGT-14 | Board resolutions | 30 days from board meeting |
| DPT-3 | Loans/deposits return | 30th June (annual) |
| MSME-1 | MSME outstanding payment | 30 April / 31 October |
| BEN-2 | Significant Beneficial Ownership | On change |
| DIR-3 KYC | Director KYC | 30th September |
| ADT-1 | Auditor appointment | 15 days from AGM |
| CHG-1 | Charge creation | 30 days from creation |
| CHG-4 | Charge satisfaction | 30 days from satisfaction |

## Instructions

1. For each company client, get their AGM date and financial year end.
2. Calculate form-wise due dates from AGM date.
3. Identify all forms due within the next 15 days.
4. Flag overdue forms (due date passed, not filed).
5. Output the alert summary.

## Output Format

```
ROC FILING ALERT — [Today's Date]
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🔴 OVERDUE — Late fee accumulating at Rs.100–200/day
  • [Client] — AOC-4 — Was due [date] — [X] days late

🟡 DUE WITHIN 7 DAYS
  • [Client] — MGT-7 — Due [date] — AGM was [date]

🟢 DUE WITHIN 15 DAYS
  • [Client] — DPT-3 — Due 30 June
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
```

## Important

- DO NOT auto-file any forms. All filings require CA/CS signature and client DSC.
- For overdue filings: use `/mca-secretarial:filing-tracker` for late fee calculation.
