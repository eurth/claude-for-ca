# Payroll Compliance Calendar Watcher

Monitor payroll compliance deadlines for all clients with employees.

## Payroll Compliance Calendar

| Obligation | Deadline | Applicable to |
|---|---|---|
| PF contribution deposit | 15th of following month | All EPF-registered employers |
| ESIC contribution deposit | 15th of following month | Establishments with 10+ employees |
| TDS on salaries (24Q) | 7th of following month | All employers (30 April for March) |
| Professional Tax (Karnataka) | Last day of month | Karnataka establishments |
| Professional Tax (Maharashtra) | 31st March (annual) | Maharashtra establishments |
| ESIC half-yearly return — I | 11th November | ESIC-registered |
| ESIC half-yearly return — II | 11th May | ESIC-registered |
| PF annual return | 30th April | EPF-registered |
| Form 24Q Q4 + Form 16 | 31 May + 15 June | All employers |

## Instructions

1. Get today's date.
2. List all clients who have payroll compliance engagements.
3. For each client, check their PF/ESIC registration and employee count.
4. Identify all payroll compliance deadlines in the next 10 days.
5. Produce alert summary.

